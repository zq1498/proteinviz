# Tool registry — annotated with subtask (Topic) and has_input / has_output (Data) IDs.
# Assumes all tools are installed; install instructions live in queryables.md.
# `wrapper`: dotted Python path to the callable, or `null` if not yet wrapped.
# `invocation`: how the tool is called (cli_subprocess, python_api, rest_api).

# ---- Structure prediction backends ----

- id: tool_colabfold
  label: ColabFold
  definition: AlphaFold2-based structure prediction (monomer and multimer) via local CLI in WSL.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_aa_sequence
    - data_fasta_file
    - data_a3m_msa
  has_output:
    - data_pdb_file
    - data_pdb_complex
    - data_plddt_per_residue
    - data_pae_matrix
    - data_ptm_score
    - data_iptm_score
    - data_actifptm_score
  wrapper: tools.predict.run_colabfold
  invocation: cli_subprocess

- id: tool_boltz1
  label: Boltz-1
  definition: Open-source AF3-class biomolecular structure predictor handling proteins, complexes, and small molecules.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_aa_sequence
    - data_fasta_file
  has_output:
    - data_pdb_file
    - data_pdb_complex
    - data_plddt_per_residue
    - data_pae_matrix
    - data_iptm_score
    - data_ptm_score
  wrapper: null
  invocation: cli_subprocess

# ---- Internal post-processing (parsers, adapters) ----
# These are not in the user-facing ontology — they exist so the orchestrator
# can dispatch every pipeline step uniformly via the registry.

- id: tool_extract_colabfold
  label: ColabFold output extractor
  definition: Parses a ColabFold output directory into ExtractedMetrics records (pLDDT, PAE, pTM, ipTM, actifpTM) — one per ranked model.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_pdb_file
    - data_pdb_complex
  has_output:
    - data_iptm_score
    - data_actifptm_score
    - data_ptm_score
    - data_plddt_per_residue
    - data_pae_matrix
  wrapper: tools.extract.extract_colabfold
  invocation: python_api

# ---- MSA generation ----

- id: tool_colabfold_search
  label: colabfold_search
  definition: MMseqs2-based MSA search producing A3M alignments for use with ColabFold.
  subtask:
    - subtask_msa_generation
  has_input:
    - data_fasta_file
  has_output:
    - data_a3m_msa
  wrapper: tools.predict.run_colabfold_msa_only
  invocation: cli_subprocess

- id: tool_dcc_msa
  label: DCC SLURM MSA pipeline
  definition: Cluster-based MSA generation via SSH/SCP/sbatch on the Duke Compute Cluster.
  subtask:
    - subtask_msa_generation
  has_input:
    - data_fasta_file
  has_output:
    - data_a3m_msa
  wrapper: tools.msa.run_msa
  invocation: cli_subprocess

# ---- Disorder prediction ----

- id: tool_iupred3
  label: IUPred3
  definition: Energy-estimation-based per-residue disorder predictor served via REST API.
  subtask:
    - subtask_disorder_core
  has_input:
    - data_aa_sequence
  has_output:
    - data_disorder_per_residue
    - data_disorder_summary
  wrapper: tools.analyze.query_iupred3
  invocation: rest_api

- id: tool_anchor2
  label: ANCHOR2
  definition: Disorder-mediated binding site predictor; same REST endpoint as IUPred3.
  subtask:
    - subtask_disorder_binding
  has_input:
    - data_aa_sequence
  has_output:
    - data_anchor_per_residue
  wrapper: null
  invocation: rest_api

- id: tool_metapredict
  label: metapredict V3
  definition: Fast offline per-residue disorder predictor; SOTA-accurate consensus model.
  subtask:
    - subtask_disorder_core
  has_input:
    - data_aa_sequence
  has_output:
    - data_disorder_per_residue
    - data_disorder_summary
  wrapper: null
  invocation: python_api

