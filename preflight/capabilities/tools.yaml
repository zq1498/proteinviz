# ---- PyRosetta energy analysis ----
# These tools run via subprocess bridge: tools/rosetta.py (proteinviz env, Python 3.12)
# spawns tools/pyrosetta_worker.py under proteinviz_pyrosetta (Python 3.14, REF2015).
# All functions are fully implemented and callable. Tier 2 because the proteinviz_pyrosetta
# conda env (JHU channel, py314_0 wheel) was non-trivial to set up.

- id: tool_rosetta_score_interface
  label: PyRosetta interface scorer
  tier: 1
  definition: >
    REF2015 interface energy via InterfaceAnalyzerMover (pack_separated=True).
    Returns dG_separated (kcal/mol REU), dSASA (Å²), and interface residue count.
    Supports arbitrary chain-jump strings (e.g. "A_B", "AB_C" for homodimer panels).
  subtask:
    - subtask_ppi
    - subtask_binding
  has_input:
    - data_pdb_complex
  has_output:
    - data_interface_score
  wrapper: tools.rosetta.score_interface
  invocation: python_api
  bindings:
    pdb_path: data_pdb_complex
  # Terminal: InterfaceScore is read from job.results["tool_rosetta_score_interface"].

- id: tool_rosetta_per_residue_energies
  label: PyRosetta per-residue energies
  tier: 1
  definition: >
    Per-residue total energy contributions from the REF2015 score function (kcal/mol REU).
    Returns both Rosetta sequential numbering and PDB numbering for cross-referencing
    with ColabFold outputs. Useful for identifying high-energy (clashed or strained) regions.
  subtask:
    - subtask_structural_analysis
  has_input:
    - data_pdb_file
  has_output:
    - data_per_residue_energy
  wrapper: tools.rosetta.per_residue_energies
  invocation: python_api
  bindings:
    pdb_path: data_pdb_file
  # Terminal: list[ResidueEnergy] is read from job.results["tool_rosetta_per_residue_energies"].

- id: tool_rosetta_alanine_scan
  label: PyRosetta alanine scan
  tier: 1
  definition: >
    Single-point alanine scan across interface residues, sorted by ΔΔG descending.
    Fast mode (default): ΔΔG = sfxn(complex_mut) − sfxn(complex_wt) — good for relative
    ranking within a panel. Rigorous mode: ΔΔG = ΔG_separated(mut) − ΔG_separated(wt)
    with FastRelax on each mutant — correct binding ddG, ~2–5× slower per residue.
    Ala and Gly residues are skipped (no sidechain to remove).
  subtask:
    - subtask_mutation
    - subtask_ppi
  has_input:
    - data_pdb_complex
  has_output:
    - data_ala_scan_result
  wrapper: tools.rosetta.alanine_scan
  invocation: python_api
  bindings:
    pdb_path: data_pdb_complex
  output_map:             # chained into tool_rosetta_confidence_filter's `scan` binding
    data_ala_scan_result: "."

- id: tool_rosetta_confidence_filter
  label: PyRosetta pLDDT confidence filter
  tier: 1
  definition: >
    Cross-references alanine scan results with per-residue pLDDT from the ColabFold
    unrelaxed PDB. Flags each hit confident (pLDDT >= threshold, default 70.0) or uncertain;
    returns them sorted confident-first then by ΔΔG descending within each tier.
    Input plddt_pdb MUST be the unrelaxed ColabFold PDB — Amber relaxation zeroes B-factors.
  subtask:
    - subtask_mutation
  has_input:
    - data_ala_scan_result
    - data_pdb_file
  has_output:
    - data_confident_hotspot_list
  wrapper: tools.rosetta.confidence_filter_scan
  invocation: python_api
  bindings:
    scan: data_ala_scan_result   # populated by tool_rosetta_alanine_scan's output_map
    plddt_pdb: data_pdb_file      # B5 refines this to data_pdb_unrelaxed (Amber zeroes B-factors)
  # Terminal: list[ConfidentHotSpot] is read from job.results["tool_rosetta_confidence_filter"].

# ---- Negative controls ----

- id: tool_scrambled_controls
  label: Scrambled control peptide generator
  tier: 1
  definition: >
    Generates composition-matched scrambled controls (same AA composition, shuffled
    order) for each test peptide. Preserves length, charge, hydrophobicity, and disorder
    propensity — only sequence-specific binding is tested. Used to establish a per-panel
    null distribution so composite_score can be expressed as a z-score.
  subtask:
    - subtask_negative_controls
  has_input:
    - data_aa_sequence
  has_output:
    - data_aa_sequence
  wrapper: tools.controls.make_scrambled_controls
  invocation: python_api
  notes: >
    Injected into predict_panel() via with_controls=True. Control IDs follow
    {peptide_id}__scram{k}. z-scores computed in build_panel_report_inputs();
    rendered in the "Selectivity vs Scrambled Controls" section of the panel report.
