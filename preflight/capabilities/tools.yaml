# Tool registry — annotated with subtask (Topic) and has_input / has_output (Data) IDs.
# Assumes all tools are installed; install instructions live in queryables.md.
# `wrapper`: dotted Python path to the callable, or `null` if not yet wrapped.
# `invocation`: how the tool is called (cli_subprocess, python_api, rest_api).

# ---- Structure prediction backends ----

- id: tool_colabfold
  label: ColabFold
  tier: 1
  priority: 10   # preferred prediction backend; wins select_tool over a future tool_boltz1
  definition: AlphaFold2-based structure prediction (monomer and multimer) via SLURM job on DCC.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_aa_sequence
    - data_fasta_file
    - data_a3m_msa
  has_output:
    - data_pdb_file
    - data_pdb_complex
    - data_plddt_per_residue
    - data_pae_matrix
    - data_ptm_score
    - data_iptm_score
    - data_actifptm_score
    - data_a3m_msa
  wrapper: tools.predict.predict_structure
  invocation: cli_subprocess
  call_kwargs:            # static defaults; a branch overrides calc_extra_ptm per-step
    fast: false
  bindings:               # wrapper kwarg -> data_* id OR reserved token
    fasta: data_fasta_file
    out_dir: _job_dir
  output_map:             # data_* id -> attribute expression on the wrapper's return value
    data_pdb_complex: pdb_paths[0]
    data_pdb_file: pdb_paths[0]
    data_a3m_msa: a3m_paths

- id: tool_predict_panel
  label: ColabFold panel (MSA-cached)
  tier: 1
  definition: >
    MSA-reuse panel pipeline for screening N peptides against one target. Submits a
    primary SLURM job (colabfold_search on the target monomer, SEARCH_ONLY=1) then a
    SLURM array job (one task per peptide) that builds paired A3Ms on the DCC node from
    the cached target MSA and runs colabfold_batch in parallel. Eliminates N-1 redundant
    MSA searches vs. calling tool_colabfold per pair. Supports homo-oligomeric targets
    (homodimers etc.) via n_target_copies in the A3M metadata header. Returns immediately
    (PanelResult); results must be downloaded from DCC once the array completes.
  subtask:
    - subtask_binding
  has_input:
    - data_fasta_file
    - data_aa_sequence
  has_output:
    - data_pdb_complex
    - data_iptm_score
    - data_actifptm_score
    - data_plddt_per_residue
    - data_a3m_msa
  wrapper: tools.predict.predict_panel
  invocation: cli_subprocess
  notes: >
    Preferred over tool_colabfold for any panel with N >= 2 peptides per target.
    Wired into tools/batch.py: build_roadmap routes binding tasks with N > 1 peptides
    to _panel_branch, which emits extraction-only Jobs; run_batch calls predict_panel
    per target before the job loop, waits for the SLURM array, downloads results, and
    populates data_colabfold_out_dir on each job. Heterodimeric targets not supported —
    use tool_colabfold for those until the multi-chain MSA path is implemented.

- id: tool_boltz1
  label: Boltz-1
  tier: 3 # Not implemented 
  definition: Open-source AF3-class biomolecular structure predictor handling proteins, complexes, and small molecules.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_aa_sequence
    - data_fasta_file
  has_output:
    - data_pdb_file
    - data_pdb_complex
    - data_plddt_per_residue
    - data_pae_matrix
    - data_iptm_score
    - data_ptm_score
  wrapper: null
  invocation: cli_subprocess

# ---- Internal post-processing (parsers, adapters) ----
# These are not in the user-facing ontology — they exist so the orchestrator
# can dispatch every pipeline step uniformly via the registry.

- id: tool_extract_colabfold
  label: ColabFold output extractor
  tier: 1
  definition: Parses a ColabFold output directory into ExtractedMetrics records (pLDDT, PAE, pTM, ipTM, actifpTM) — one per ranked model.
  subtask:
    - subtask_folding
    - subtask_binding
    - subtask_ppi
  has_input:
    - data_pdb_file
    - data_pdb_complex
  has_output:
    - data_iptm_score
    - data_actifptm_score
    - data_ptm_score
    - data_plddt_per_residue
    - data_pae_matrix
  wrapper: tools.extract.extract_colabfold
  invocation: python_api
  bindings:               # single-pair default; _panel_branch overrides out_dir -> data_colabfold_out_dir
    out_dir: _job_dir
  # No output_map: results are read from job.results["tool_extract_colabfold"] by the
  # report adapter, not chained into a downstream step's bindings.

# ---- Disorder prediction ----

- id: tool_iupred3
  label: AIUPred (local)
  tier: 1
  definition: Deep-learning per-residue disorder predictor via the local AIUPred package (PyTorch). REST API endpoint (iupred3.elte.hu) is defunct; query_aiupred() is the live implementation. query_iupred3 is a legacy alias.
  subtask:
    - subtask_disorder_core
  has_input:
    - data_aa_sequence
  has_output:
    - data_disorder_per_residue
    - data_disorder_summary
  wrapper: tools.analyze.query_aiupred
  invocation: local_python
  bindings:               # NOTE: query_aiupred takes one sequence; binding/panel jobs pack
    seq: data_aa_sequence  # data_aa_sequence as a list — B5 wiring resolves which sequence to pass.
  # Terminal: per-residue disorder is read from job.results["tool_iupred3"] by the report.

- id: tool_metapredict
  label: metapredict V3
  tier: 1
  definition: Fast offline per-residue disorder predictor; SOTA-accurate consensus model.
  subtask:
    - subtask_disorder_core
  has_input:
    - data_aa_sequence
  has_output:
    - data_disorder_per_residue
    - data_disorder_summary
  wrapper: tools.metapredict.predict_disorder
  invocation: python_api # subprocess bridge to proteinviz_metapredict conda env
  bindings:
    seq: data_aa_sequence
  # Terminal: MetapredictResult is read from job.results["tool_metapredict"] by the report.

# ---- Sequence biophysics ----

- id: tool_analyze_sequence
  label: Sequence feature analyzer
  tier: 1
  definition: >
    Biophysical sequence descriptors and heuristic flags (MW, pI, aromatic fraction,
    cysteine positions; IDR/hydrophobic/PPII/length flags) via Biopython ProteinAnalysis.
    Always-on analysis step in binding/monomer plans.
  subtask:
    - subtask_structural_analysis
  has_input:
    - data_aa_sequence
  has_output:
    - data_sequence_features
  wrapper: tools.analyze.analyze_sequence
  invocation: python_api
  bindings:               # monomer default; binding/panel branches override seq -> data_peptide_sequence
    seq: data_aa_sequence
  # Terminal: SequenceFeatures is read from job.results["tool_analyze_sequence"] by the report.

- id: tool_localcider
  label: localCIDER
  tier: 1
  definition: Sequence-based biophysical descriptors for IDRs — charge patterning, composition, hydropathy.
  subtask:
    - subtask_disorder_ensemble
  has_input:
    - data_aa_sequence
  has_output:
    - data_kappa
    - data_ncpr
    - data_fcr
  wrapper: tools.analyze.analyze_cider
  invocation: python_api
  bindings:
    seq: data_aa_sequence
  # Terminal: CIDERFeatures is read from job.results["tool_localcider"] by the report.

