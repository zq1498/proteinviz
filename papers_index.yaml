    - "DSSP hydrogen bond identification uses an electrostatic model with a 0.5 kcal/mol energy threshold; the algorithm is sensitive to backbone coordinate precision and performs poorly on structures with incomplete side chains or missing residue coordinates"
    - "DSSP RSA (relative solvent accessibility) is normalized against a Gly-X-Gly reference; RSA < 0.25 = buried, RSA > 0.40 = surface-exposed — these thresholds define interface core vs. rim when classifying hot spot residues"

  design_implications:
    - "Do not apply DSSP to unrelaxed ColabFold predictions; the unrelaxed backbone geometry contains steric clashes that corrupt the hydrogen bond network — Amber relaxation is required before reliable secondary structure assignment"
    - "Use DSSP RSA thresholds to classify interface residues as core (RSA < 0.25) vs. rim when interpreting alanine scan results; core hot spots are more interpretable and experimentally reliable than rim predictions"

