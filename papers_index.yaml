  key_claims:
    - "A knowledge-based potential trained on known biological quaternary contacts vs. crystal-packing artifacts achieves better discrimination than geometric scoring alone, with AUC > 0.85 on held-out benchmark sets (Table 3)"
    - "The scoring function is parameterized on residue-residue contact propensities at quaternary interfaces, with separate statistics for homo- and hetero-assemblies; pooling the two classes degrades performance"
