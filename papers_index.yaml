  key_claims:
    - "AF2 achieves median backbone RMSD of 0.96 Å on CASP14 free-modelling targets, the first system to approach experimental accuracy at scale (Fig. 4)"
    - "pLDDT is a reliable per-residue confidence metric calibrated as a local distance difference test; values > 70 correlate with backbone placement within ~2 Å of the true structure; values < 50 do not indicate modeling failure but frequently mark intrinsically disordered regions (Extended Data Fig. 9)"
    - "PAE (predicted aligned error) provides residue-pair positional confidence; high inter-chain PAE indicates uncertain relative domain orientation and is the primary signal for disordered linkers between domains"

