    - "ANCHOR2, integrated in IUPred3, identifies disorder-based binding regions (MoRFs) where transient local structure forms only upon binding a partner; ANCHOR2 sites in a target are candidate binding interfaces not visible in unbound crystal structures (Fig. 2)"
