# === STRUCTURAL ANALYSIS SOURCE PAPERS ===

- doi: "10.12688/f1000research.7931.1"
  title: "FreeSASA: An Open Source C Library for Solvent Accessible Surface Area Calculations"
  authors: "Mitternacht et al."
  year: 2016
  filename: "mitternacht_2016_freesasa.pdf"

  mechanisms:
    - "statistical / mathematical methodology"
  system_proteins:
    - "benchmark PDB protein structures"
  experimental_methods:
    - "X-ray crystallography"

  key_claims:
    - "FreeSASA implements both Shrake-Rupley (sphere-point) and Lee-Richards (rolling-probe) SASA algorithms in C with Python bindings; for a 300-residue protein both algorithms agree to within ~1% and complete in under 100 ms"
    - "The Python structureArray API enables simultaneous SASA calculation on isolated chains and the complex without writing intermediate PDB files, which is required for correct buried surface area (BSA = SASA_A + SASA_B − SASA_AB) computation"
    - "BSA calculations are only correct when all three SASA values (chain A isolated, chain B isolated, and the complex) are computed with the same probe radius and vdW parameter set; mixing radii introduces systematic error"

  design_implications:
    - "BSA > ~600 Å² is the commonly cited threshold for a meaningful interface; for peptides shorter than ~10 residues BSA will often fall below this — report BSA but do not use it as a hard filter for short peptides"
    - "Always pass the complex PDB to structureArray rather than running separate single-chain calculations to guarantee probe-radius consistency across the BSA subtraction"

