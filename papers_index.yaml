- doi: "10.1111/cbdd.13453"
  title: "Improving Inverse Docking Target Identification with Z-Score Selection"
  authors: "Kim et al."
  year: 2019
  filename: "kim_2019_inverse_docking_zscore.pdf"

  mechanisms:
    - "induced fit"
    - "hydrophobic anchor"
  system_proteins:
    - "FDA-approved drug target panel"
    - "diverse receptor benchmark"
  experimental_methods:
    - "X-ray crystallography"

  key_claims:
    - "Per-target Z-score normalization (each ligand's docking score expressed relative to the score distribution of that ligand across all targets) outperforms global Z-score normalization for identifying the correct target in inverse docking, with top-1 accuracy improving by 12–18% (Table 2)"
    - "Global null distributions conflate target-specific score variance with global population variance; per-target normalization isolates selectivity signal by controlling for ligand-specific score inflation or deflation"
    - "The per-target Z-score transformation is conceptually equivalent to computing 'how much better does this ligand bind this target compared to all other targets?' — a selectivity metric rather than an absolute affinity metric"

  design_implications:
    - "When screening a peptide panel against multiple targets, compute per-peptide Z-scores (each peptide's composite score relative to its distribution across all targets) to identify selectively binding peptides; absolute composite scores conflate affinity with peptide-level scoring bias"
    - "Per-target normalization is preferable to global normalization when the composite score variance differs substantially across targets — which is expected for targets with different binding pocket geometries"

  cites_in_project: []

- doi: "10.2202/1544-6115.1585"
  title: "Permutation P-Values Should Never Be Zero: Calculating Exact P-Values When Permutations Are Randomly Drawn"
  authors: "Phipson et al."
  year: 2010
  filename: "phipson_2010_permutation_pvalues.pdf"

  mechanisms:
    - "statistical / mathematical methodology"
  system_proteins:
    - "statistical methodology — no specific protein system"
  experimental_methods: []

  key_claims:
    - "Using the formula p = r/B (where r is the number of permutations exceeding the observed statistic and B is the total number of permutations) produces p-values of exactly 0 when the observed value exceeds all permutations — a statistically invalid result that overstates significance (Eq. 1)"
    - "The correct formula is p = (r+1)/(B+1), which bounds the minimum achievable p-value at 1/(B+1); this accounts for the fact that the observed value is itself one realization from the permutation distribution"
    - "With B = 99 permutations the minimum achievable p-value is 0.01; with B = 999 it is 0.001; the required number of permutations must be chosen before collecting data based on the desired resolution of the p-value"

  design_implications:
    - "When computing composite score p-values from a shuffled-peptide null distribution, always use p = (r+1)/(B+1); reporting p = 0 from any finite permutation test is incorrect and should be flagged as a pipeline bug"
    - "Use at least 99 shuffled permutations per candidate to achieve p-value resolution of 0.01; use 999 if single-residue discrimination at p < 0.01 is required — undershooting inflates the apparent significance of borderline cases"
    - "The minimum p-value is a function of permutation count, not candidate quality; when comparing p-values across candidates with different permutation counts, normalize by the minimum achievable p-value for each"

  cites_in_project: []

- doi: "10.1101/2021.10.04.463034"
  title: "Protein Complex Prediction with AlphaFold-Multimer"
  authors: "Evans et al."
  year: 2022
  filename: "evans_2022_alphafold_multimer.pdf"

  mechanisms:
    - "coupled folding upon binding"
    - "induced fit"
  system_proteins:
    - "CASP14 benchmark complexes"
    - "heterodimeric protein complexes"
    - "homomeric protein complexes"
  experimental_methods:
    - "X-ray crystallography"
    - "cryo-EM"

  key_claims:
    - "AFM substantially outperforms AF2 monomer + rigid docking for multi-chain target prediction; the joint MSA and inter-chain attention mechanism enables modeling of co-evolutionary coupling across chains (Fig. 3)"
    - "ipTM is the primary confidence metric for complex-level accuracy: ipTM measures inter-chain TM-score confidence and is more informative than pTM (which conflates intra- and inter-chain confidence) for ranking complex predictions (Supplementary Methods)"
    - "ipTM > 0.8 is associated with correct complex topology in CASP14 benchmarks; performance degrades for complexes with large disordered regions or flexible interfaces where the correct structure is not well-represented by a single static model"

  design_implications:
    - "ipTM is the canonical first-pass metric for ColabFold complex predictions; use ipTM ≥ 0.75–0.8 as a screening threshold, calibrated against target-specific benchmarks rather than applied as an absolute gate"
    - "pTM is less informative than ipTM for peptide-protein heterodimers; do not substitute pTM for ipTM in the composite score"
    - "AFM benchmark thresholds were established on structured, globular protein complexes; they require recalibration for peptide-protein interactions where the peptide undergoes disorder-to-order transition and interface pLDDT is lower by construction"

