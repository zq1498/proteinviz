- doi: "10.3389/fbinf.2022.959160"
  title: "Improving Peptide-Protein Docking with AlphaFold-Multimer Using Forced Sampling"
  authors: "Johansson-Åkhe et al."
  year: 2022
  filename: "johansson_akhe_2022_forced_sampling_AFM.pdf"

  mechanisms:
    - "coupled folding upon binding"
    - "fuzzy complex"
  system_proteins:
    - "peptide-protein benchmark complexes"
  experimental_methods:
    - "MD simulation"

  key_claims:
    - "Subsampling MSA depth and dropping templates during AlphaFold-Multimer inference forces exploration of a broader conformational landscape, increasing the probability of sampling near-native poses for short peptides (Fig. 2)"
    - "Aggregating scores across ≥25 randomly seeded models with varied MSA depth yields better discrimination between true binders and non-binders than relying on the single top-ranked model from a default 5-model run"
    - "Forced sampling gains are largest for peptides shorter than ~20 residues, where the default MSA-constrained sampling tends to collapse into a single low-diversity ensemble"

  design_implications:
    - "Generate at least 25 models per complex with MSA subsampling enabled; a single 5-model AF-Multimer run undersamples conformational space for short peptides"
    - "Use the mean or median ipTM across the model ensemble rather than the max; max-scoring single models have higher false positive rate"
    - "Score variance across the ensemble is itself a signal — high variance with high mean is a red flag; confident true binders show consistent high scores across replicates"

  cites_in_project: []

- doi: "10.1093/bioinformatics/btad424"
  title: "Evaluation of AlphaFold-Multimer Prediction on Multi-Chain Protein Complexes"
  authors: "Zhu et al."
  year: 2023
  filename: "zhu_2023_AFM_multimer_evaluation.pdf"

  mechanisms:
    - "coupled folding upon binding"
    - "induced fit"
  system_proteins:
    - "benchmark heterodimeric complexes"
    - "benchmark homodimeric complexes"
  experimental_methods:
    - "X-ray crystallography"
    - "cryo-EM"

  key_claims:
    - "ipTM is the single most predictive AFM confidence metric for complex-level structural accuracy across a benchmark of ~700 multi-chain assemblies; ipTM ≥ 0.75–0.8 corresponds to correct interface topology in the majority of cases (Table 2)"
    - "Interface pLDDT provides complementary information to ipTM and their combination modestly outperforms either metric alone in distinguishing correct from incorrect models"
    - "Optimal ipTM threshold differs between homo- and heterodimers; applying a single global threshold introduces systematic errors for one class"

  design_implications:
    - "Use ipTM ≥ 0.75 as a minimum screening cutoff for heterodimeric peptide-protein complexes; ipTM thresholds established on balanced benchmarks may need recalibration on peptide-specific datasets"
    - "Do not use ipTM alone as a binary accept/reject gate; combining ipTM with interface pLDDT reduces false positives without substantially increasing false negatives"
    - "Benchmark-derived thresholds are population statistics; a single complex with ipTM = 0.74 is not categorically different from one at 0.76 — treat thresholds as soft filters, not hard decisions"

  cites_in_project: []

- doi: "10.1093/bioinformatics/btaf107"
  title: "actifpTM: A Refined Confidence Metric of AlphaFold2 Predictions Involving Flexible Regions"
  authors: "Varga et al."
  year: 2025
  filename: "varga_2025_actifptm.pdf"

  mechanisms:
    - "fuzzy complex"
    - "motif remains disordered"
    - "coupled folding upon binding"
  system_proteins:
    - "MDM2"
    - "p53 transactivation domain"
    - "PCNA"
    - "peptide-protein complexes with disordered flanking regions"
  experimental_methods:
    - "MD simulation"

  key_claims:
    - "actifpTM restricts the ipTM calculation to the active interface region (residues within a distance cutoff of the binding partner), eliminating the signal dilution caused by disordered N/C-terminal flanks that are present but non-contacting (Fig. 1)"
    - "For peptide-protein complexes where the peptide contains flexible extensions, actifpTM is a substantially better discriminator of true binders from non-binders than raw ipTM; the improvement is largest when the disordered portion exceeds ~30% of peptide length"
    - "actifpTM > 0.9 on the focused interface region provides higher precision than ipTM > 0.8 for peptides with disordered flanking regions; at matched recall, actifpTM reduces false positive rate by approximately 2-fold"

  design_implications:
    - "Use actifpTM as the primary per-complex confidence metric when any peptide in the dataset has disordered flanking regions; ipTM alone systematically underestimates interface quality in this setting"
    - "A large discrepancy between ipTM and actifpTM (>0.1) is a direct diagnostic for flanking-region signal dilution — actifpTM is the more trustworthy number in that case"
    - "When computing the composite score, weight actifpTM more heavily than ipTM for peptides longer than ~25 residues; the improvement from focused scoring increases with peptide length"

  cites_in_project: []

- doi: "10.1021/acschembio.4c00418"
  title: "AlphaFold Ensemble Competition Screens Enable Peptide Binder Design with Single-Residue Sensitivity"
  authors: "Vosbein et al."
  year: 2024
  filename: "vosbein_2024_ensemble_competition_peptide.pdf"

  mechanisms:
    - "coupled folding upon binding"
    - "hydrophobic anchor"
    - "electrostatic steering"
  system_proteins:
    - "SH2 domain"
    - "peptide binder benchmark complexes"
  experimental_methods:
    - "fluorescence anisotropy"
    - "MD simulation"

  key_claims:
    - "Ensemble competition — scoring each candidate peptide against the same target alongside shuffled/scrambled variants in the same AF-Multimer run — dramatically reduces false positive rate compared to ranking by absolute ipTM (Fig. 2)"
    - "Competition-normalized scores can resolve single-residue substitution effects that are invisible in absolute ipTM rankings; validated on SH2 domain binders where experimental Kd differences of 2–5-fold correlated with competition score differences (Fig. 3)"
    - "Shuffled peptides with matched amino acid composition but scrambled sequence serve as effective per-candidate null sequences; this controls for compositional bias without requiring independent negative data"

  design_implications:
    - "Implement a competition-based null distribution by folding each candidate against its amino-acid-shuffled permutations; the competition score (candidate ipTM minus mean permuted ipTM) is more informative than raw ipTM for ranking binders"
    - "At least 5–10 shuffled permutations per candidate are needed to estimate the null mean reliably; 20+ permutations stabilize the standard deviation estimate and support p-value computation"
    - "Do not rank candidates from different amino acid compositions directly by absolute ipTM; competition normalization removes composition-driven score inflation that would otherwise bias rankings toward charged or aromatic-rich peptides"

  cites_in_project: []

- doi: "10.1093/nar/gkz368"
  title: "Protein Interaction Z Score Assessment (PIZSA): An Empirical Scoring Scheme for Evaluation of Protein-Protein Interactions"
  authors: "Roy et al."
  year: 2019
  filename: "roy_2019_PIZSA.pdf"

  mechanisms:
    - "hydrophobic anchor"
    - "electrostatic steering"
    - "aromatic stacking"
  system_proteins:
    - "benchmark PDB biological interfaces"
    - "crystal contact non-biological interfaces"
  experimental_methods:
    - "X-ray crystallography"

  key_claims:
    - "PIZSA Z-scores computed against a background distribution of non-biological crystal contact interfaces outperform raw pairwise interaction scores in distinguishing biological from non-biological PPIs across a benchmark of >2,000 complexes (Table 1)"
    - "The background distribution is empirically parameterized on crystal contacts extracted from PDB entries marked as non-biological assemblies; this provides a data-driven null that is closer to the test distribution than random decoys"
    - "PIZSA Z-scores correlate modestly with experimental binding affinities for well-curated benchmark sets (Pearson r ~0.5); the score is more reliable for binary classification (binder/non-binder) than for affinity ranking"

  design_implications:
    - "Z-score normalization against a background null distribution is more informative than raw interface scores; parameterize the null from shuffled or permuted complexes rather than arbitrary random conformations"
    - "A Z-score > 1.5–2.0 relative to the background distribution is a reasonable threshold for classifying a complex as specifically folded; apply this framing when designing composite score cutoffs"
    - "The PIZSA precedent supports using empirically derived (not theoretical) null distributions; collect scrambled-peptide AF-Multimer outputs as the background rather than assuming a parametric null"

  cites_in_project: []

